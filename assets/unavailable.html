<!doctype html>
<html><head><meta charset="utf-8"><title>Registry unavailable</title><style>
body{margin:0;background:#10151f;color:#e8edf7;font:15px -apple-system,system-ui;padding:64px}
.card{max-width:720px;margin:auto;background:#1b2331;border:1px solid #334055;border-radius:16px;padding:32px}
h1{margin:0 0 8px;font-size:24px}p{color:#aebbd0;line-height:1.55}
button{display:inline-block;margin:16px 8px 0 0;padding:10px 16px;border:0;border-radius:9px;background:#4f7cff;color:#fff;font:inherit;cursor:pointer}
button.secondary{background:#2a3446;color:#dce6f7}button.link{background:none;color:#9dbcff;padding:6px 0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
</style></head><body><div class="card">
<h1>Free Registry unreachable</h1>
<p><span class="mono">{{domain}}</span> could not be looked up in the GitHub registry.</p>
<p>{{message}}</p>
<p id="freeNote">{{free_note}}</p>
<button id="retry" type="button">Retry registry</button>
{{public_button}}
<button id="home" class="link" type="button">Go to start page</button>
</div>
<script>
function send(cmd){console.log('fdb:'+JSON.stringify(cmd))}
document.getElementById('retry').onclick=function(){send({cmd:'navigate',url:'fdn://'+{{domain_js}}})};
var pub=document.getElementById('public');
if(pub)pub.onclick=function(){send({cmd:'navigate',url:{{public_js}}})};
document.getElementById('home').onclick=function(){send({cmd:'home'})};
</script></body></html>
