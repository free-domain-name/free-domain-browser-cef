<!doctype html>
<html><head><meta charset="utf-8"><title>Registry unavailable</title>
<link rel="stylesheet" href="ui-kit.css"><style>
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);padding:64px}
.card{max-width:720px;margin:auto;background:var(--status);border:1px solid var(--border);border-radius:var(--radius-dialog);padding:32px}
h1{margin:0 0 8px;font-size:24px}p{color:var(--muted);line-height:1.55}
button{display:inline-block;margin:16px 8px 0 0;padding:10px 16px;border:0;border-radius:var(--radius-control);background:var(--accent);color:var(--on-accent);font:inherit;cursor:pointer}
button.secondary{background:var(--button);color:var(--text)}button.link{background:none;color:var(--accent);padding:6px 0}
.mono{font-family:var(--font-mono);font-size:12px;word-break:break-all}
</style></head><body><div class="card">
<h1>Free Registry unreachable</h1>
<p><span class="mono">{{domain}}</span> could not be looked up in the GitHub registry.</p>
<p>{{message}}</p>
<p id="freeNote">{{free_note}}</p>
<button id="retry" type="button">Retry registry</button>
{{public_button}}
<button id="home" class="link" type="button">Go to start page</button>
</div>
<script>
function send(cmd){console.log('fdb:'+JSON.stringify(cmd))}
// The retry asks again: the old pick must not answer for the registry.
document.getElementById('retry').onclick=function(){send({cmd:'retry',url:'fdn://'+{{domain_js}}})};
var pub=document.getElementById('public');
if(pub)pub.onclick=function(){send({cmd:'navigate',url:{{public_js}}})};
document.getElementById('home').onclick=function(){send({cmd:'home'})};
</script></body></html>
