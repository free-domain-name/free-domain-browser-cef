<html><head><meta charset="utf-8"><style>
body{margin:0;background:#10151f;color:#e8edf7;font:15px -apple-system,system-ui;padding:64px}
.card{max-width:680px;margin:auto;background:#1b2331;border:1px solid #334055;border-radius:16px;padding:32px}
h1{margin:0 0 8px;font-size:24px}p{color:#aebbd0;line-height:1.5;word-break:break-all}
a{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:9px;text-decoration:none;background:#4f7cff;color:#fff}
code{color:#8fb3ff}</style><title>Page could not be loaded</title></head><body><div class="card">
<h1>Page could not be loaded</h1>
<p>{{error}} <code>({{code}})</code></p>
<p>{{url}}</p>
<a href="{{url}}">Retry</a>
</div></body></html>
