<html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);padding:64px}
.card{max-width:680px;margin:auto;background:var(--status);border:1px solid var(--border);border-radius:var(--radius-dialog);padding:32px}
h1{margin:0 0 8px;font-size:24px}p{color:var(--muted);line-height:1.5;word-break:break-all}
a{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:var(--radius-control);text-decoration:none;background:var(--accent);color:var(--on-accent)}
code{color:var(--accent)}</style><title>Page could not be loaded</title>
<link rel="stylesheet" href="ui-kit.css"></head><body><div class="card">
<h1>Page could not be loaded</h1>
<p>{{error}} <code>({{code}})</code></p>
<p>{{url}}</p>
<a href="{{url}}">Retry</a>
</div></body></html>
