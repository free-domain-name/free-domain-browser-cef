<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0f131a;color:#e8edf7;font:14px -apple-system,system-ui;height:100vh;display:flex}
aside{width:260px;background:#151b25;border-right:1px solid #263042;padding:20px 16px}
aside h1{font-size:15px;margin:0 0 16px;color:#fff}
.room{padding:9px 10px;border-radius:8px;color:#aeb9cc;cursor:pointer;margin-bottom:4px}
.room.active{background:#22304a;color:#fff}
main{flex:1;display:flex;flex-direction:column}
header{padding:18px 24px;border-bottom:1px solid #263042;font-weight:600}
.messages{flex:1;padding:24px;overflow:auto}
.msg{max-width:70%;margin-bottom:14px;padding:10px 13px;border-radius:10px;background:#1b2331;line-height:1.45}
.msg.me{margin-left:auto;background:#2f4f9e}
.meta{font-size:11px;color:#8d9ab1;margin-bottom:4px}
footer{display:flex;gap:10px;padding:16px 24px;border-top:1px solid #263042}
input{flex:1;background:#111722;border:1px solid #334055;border-radius:9px;color:#fff;padding:11px 13px;font:inherit}
button{background:#4f7cff;border:0;border-radius:9px;color:#fff;padding:11px 18px;font:inherit}
.note{font-size:12px;color:#8d9ab1;padding:0 24px 10px}
</style><title>Free Domain Chat</title></head><body>
<aside><h1>Free Domain Chat</h1><div class="room active" data-room="general"># general</div><div class="room" data-room="registry"># registry</div><div class="room" data-room="support"># support</div></aside>
<main><header id="room"># general</header><div class="messages" id="messages"></div><div class="note">Local chat prototype — messages stay in this browser profile.</div><footer><input id="text" placeholder="Message #general"><button id="send">Send</button></footer></main>
<script>
var room='general';
function key(){return 'fdb-chat-'+room}
function load(){try{return JSON.parse(localStorage.getItem(key())||'[]')}catch(e){return []}}
function save(v){try{localStorage.setItem(key(),JSON.stringify(v))}catch(e){}}
function render(){var box=document.getElementById('messages');box.innerHTML='';var list=load();if(!list.length){box.innerHTML='<div class="note" style="padding:0">No messages yet.</div>'}list.forEach(function(m){var d=document.createElement('div');d.className='msg'+(m.me?' me':'');var meta=document.createElement('div');meta.className='meta';meta.textContent=(m.me?'you':'local')+' · '+m.time;d.appendChild(meta);d.appendChild(document.createTextNode(m.text));box.appendChild(d)});box.scrollTop=box.scrollHeight}
function send(){var input=document.getElementById('text');var text=input.value.trim();if(!text)return;var list=load();list.push({text:text,me:true,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});save(list);input.value='';render()}
document.getElementById('send').onclick=send;document.getElementById('text').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
document.querySelectorAll('.room').forEach(function(el){el.onclick=function(){document.querySelectorAll('.room').forEach(function(x){x.classList.remove('active')});el.classList.add('active');room=el.dataset.room;document.getElementById('room').textContent='#'+room;document.getElementById('text').placeholder='Message #'+room;render()}});
render();
</script>
</body></html>
