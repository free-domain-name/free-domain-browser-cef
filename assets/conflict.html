<html><head><meta charset="utf-8"><style>
body{margin:0;background:#10151f;color:#e8edf7;font:15px -apple-system,system-ui;padding:64px}
.card{max-width:680px;margin:auto;background:#1b2331;border:1px solid #334055;border-radius:16px;padding:32px}
h1{margin:0 0 8px;font-size:24px}p{color:#aebbd0;line-height:1.5}
a{display:inline-block;margin:12px 8px 0 0;padding:10px 16px;border-radius:9px;text-decoration:none;background:#4f7cff;color:#fff}
a.secondary{background:#2a3446;color:#dce6f7}
code{color:#8fb3ff}</style></head><body><div class="card">
<h1>{{domain}}</h1>
<p>This name exists in both the Free Domain Registry and public DNS. Choose where to go.</p>
<a href="{{registry_choice}}">Open registry site</a>
<a class="secondary" href="{{public_choice}}">Open public website</a>
<p style="font-size:12px;margin-top:24px">Registry target: <code>{{target}}</code></p>
</div></body></html>
