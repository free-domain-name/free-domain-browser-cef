<html><head><meta charset="utf-8"><title>Free Domain Browser</title></head><body style="margin:0;background:#1f2430;color:#fff;font:13px -apple-system,system-ui;overflow:hidden">
<div id="tabs" style="height:32px;display:flex;align-items:center;gap:4px;padding:0 10px;box-sizing:border-box;background:#171b24"></div>
<div style="height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box">
<b style="font-size:13px">Free Domain Browser</b>
<button id="back" onclick="send({cmd:'back'})" title="Back" style="background:#2a3040;color:#fff;border:0;border-radius:8px;padding:7px 10px;font:inherit">◀</button>
<button id="forward" onclick="send({cmd:'forward'})" title="Forward" style="background:#2a3040;color:#fff;border:0;border-radius:8px;padding:7px 10px;font:inherit">▶</button>
<button id="reload" onclick="send({cmd:'reload'})" title="Reload" style="background:#2a3040;color:#fff;border:0;border-radius:8px;padding:7px 10px;font:inherit">↻</button>
<span id="sec" title="Connection" style="font-size:12px">🔒</span>
<input id="url" value="https://yahoo.com/" style="flex:1;background:#fff;color:#111;border:0;border-radius:8px;padding:7px 11px;font:inherit">
<button onclick="chat()" title="Chat" style="background:#2a3040;color:#fff;border:0;border-radius:8px;padding:7px 11px;font:inherit">💬</button>
<button onclick="settings()" title="Settings" style="background:#2a3040;color:#fff;border:0;border-radius:8px;padding:7px 11px;font:inherit">⚙</button>
<button onclick="go()" style="background:#4f7cff;color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit">Go</button>
</div>
<div id="status" style="display:none;position:fixed;left:0;bottom:0;right:0;height:20px;line-height:20px;padding:0 12px;background:#111722;color:#aebbd0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
<script>
var tabs=[{uid:0,url:'',label:'New Tab'}];
var active=0;var lastClosed=null;var nextUid=1;
function current(){return tabs[active]}
function tabForUid(uid){for(var i=0;i<tabs.length;i++){if(tabs[i].uid===uid)return tabs[i]}return null}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
  var box=document.getElementById('tabs');box.innerHTML='';
  tabs.forEach(function(t,i){
    var b=document.createElement('button');
    b.style.cssText='border:0;border-radius:6px 6px 0 0;padding:5px 8px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;'+
      (i===active?'background:#1f2430;color:#fff':'background:#2a3040;color:#9aa4b8');
    b.title=t.url;
    var label=document.createElement('span');label.textContent=t.label||t.url;b.appendChild(label);
    var close=document.createElement('span');close.textContent='×';close.title='Close tab';
    close.onclick=function(e){e.stopPropagation();closeTab(i)};b.appendChild(close);
    b.onclick=function(){active=i;render();send({cmd:'select_tab',uid:t.uid})};
    box.appendChild(b);
  });
  var plus=document.createElement('button');
  plus.textContent='+';plus.title='New tab';
  plus.style.cssText='border:0;border-radius:6px;padding:5px 9px;background:#2a3040;color:#fff;font:inherit;cursor:pointer';
  plus.onclick=function(){newTab('')};
  box.appendChild(plus);
  document.getElementById('url').value=current().url||'';
  var t=current();
  document.getElementById('back').disabled=!t.canBack;
  document.getElementById('forward').disabled=!t.canForward;
}
function newTab(u){
  var uid=nextUid++;
  tabs.push({uid:uid,url:u||'',label:'New Tab'});active=tabs.length-1;render();
  send({cmd:'new_tab',uid:uid,url:u||''});
}
function closeTab(i){
  if(tabs.length<2)return;
  var closing=tabs[i];
  lastClosed={url:closing.url,label:closing.label};
  tabs.splice(i,1);
  if(i<active)active--;
  if(active>=tabs.length)active=tabs.length-1;
  render();
  send({cmd:'close_tab',uid:closing.uid});
  send({cmd:'select_tab',uid:current().uid});
}
function go(){var u=document.getElementById('url').value.trim();if(!u){send({cmd:'home'});return}if(!/^[a-z]+:\/\//i.test(u))u='https://'+u;navigate(u)}
function send(cmd){console.log('fdb:'+JSON.stringify(cmd))}
function navigate(u){var t=current();t.url=u;send({cmd:'navigate',url:u})}
function settings(){send({cmd:'settings'})}
function chat(){send({cmd:'chat'})}
window.fdbStatus=function(text){var el=document.getElementById('status');if(!el)return;el.textContent=text||'';el.style.display=text?'block':'none'};
window.fdbLoad=function(loading,back,forward,uid){var t=tabForUid(uid);if(!t)return;t.canBack=!!back;t.canForward=!!forward;if(uid===current().uid){render();document.getElementById('reload').textContent=loading?'✕':'↻';document.body.style.cursor=loading?'progress':'default'}};
window.fdbUpdate=function(url,title,uid){var t=tabForUid(uid);if(!t)return;if(url)t.url=url;if(title)t.label=title;var sec=document.getElementById('sec');if(sec){sec.textContent=url&&url.indexOf('https://')===0?'🔒':url&&url.indexOf('http://')===0?'⚠':'📄'}if(uid===current().uid)render()};
document.getElementById('url').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='t'){e.preventDefault();newTab('')}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(active)}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='l'){e.preventDefault();document.getElementById('url').focus();document.getElementById('url').select()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='r'){e.preventDefault();send({cmd:'reload'})}
  if(e.ctrlKey&&e.key==='Tab'){e.preventDefault();active=(active+1)%tabs.length;render();send({cmd:'select_tab',uid:current().uid})}
  if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)){e.preventDefault();var n=Math.min(parseInt(e.key,10)-1,tabs.length-1);active=n;render();send({cmd:'select_tab',uid:current().uid})}
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key.toLowerCase()==='t'&&lastClosed){
    e.preventDefault();var u=lastClosed.url;lastClosed=null;newTab(u||'');
  }
});
render();</script>
</body></html>
