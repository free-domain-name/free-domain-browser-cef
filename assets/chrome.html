<html><body style="margin:0;background:#1f2430;color:#fff;font:14px -apple-system,system-ui;">
<div style="height:64px;display:flex;align-items:center;gap:12px;padding:0 18px;box-sizing:border-box">
<b>Free Domain Browser</b>
<input id="url" value="https://yahoo.com/" style="flex:1;background:#fff;color:#111;border:0;border-radius:8px;padding:8px 12px;font:inherit">
<button onclick="go()" style="background:#4f7cff;color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit">Go</button>
</div>
<script>
function go(){var u=document.getElementById('url').value.trim();if(!u)return;location.href='https://fdb.invalid/navigate?url='+encodeURIComponent(u);}
document.getElementById('url').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
</script>
</body></html>
