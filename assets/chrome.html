<html><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><title>Free Domain Browser</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--chrome);color:var(--text);font:13px -apple-system,system-ui;overflow:hidden}
#tabs{height:32px;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--bg);overflow-x:auto;overflow-y:hidden}
#tabs button{border:0;border-radius:6px 6px 0 0;padding:5px 8px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:220px}
#tabs button.active{background:var(--chrome);color:var(--text)}#tabs button:not(.active){background:var(--button);color:var(--muted)}
#tabs button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#tabs .close{opacity:.55;font-size:14px;line-height:1}#tabs .close:hover{opacity:1}
#tabs .plus{border-radius:6px;padding:5px 9px;background:var(--button);color:var(--text)}
#tabs .tab-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none}
#tabs button[data-source=registry] .tab-dot{background:#2dd4bf}#tabs button[data-source=public] .tab-dot{background:#4f7cff}
.toolbar{height:64px;display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{font-weight:650;font-size:13px;white-space:nowrap;margin-right:2px}
.icon{border:0;border-radius:8px;background:var(--button);color:var(--text);padding:7px 10px;font:inherit;cursor:pointer;min-width:34px}
.icon.active{background:#2a4a7a;color:#fff}
.icon:hover{background:var(--button-hover)}.icon:disabled{opacity:.4;cursor:default}
#sec{font-size:12px;min-width:18px;text-align:center}
#url{flex:1;background:var(--field);color:var(--field-text);border:0;border-radius:8px;padding:7px 11px;font:inherit;outline:none;min-width:80px}
#url:focus{box-shadow:0 0 0 2px var(--accent)}
.go{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
#progress{display:none;position:fixed;top:32px;left:0;right:0;height:2px;background:var(--accent);transform-origin:0 50%;animation:fdb-progress 1.1s ease-in-out infinite;z-index:9}
@keyframes fdb-progress{0%{transform:scaleX(.05)}50%{transform:scaleX(.7)}100%{transform:scaleX(1);opacity:0}}
body.loading #progress{display:block}
#statusBubble{position:fixed;left:8px;bottom:8px;z-index:30;max-width:62%;background:var(--chrome);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;box-shadow:0 6px 22px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .18s ease}
#statusBubble[hidden]{display:none}
body.compact #tabs{height:26px}body.compact .toolbar{padding:0 8px;gap:5px}body.compact .icon{padding:6px 8px;min-width:30px}body.compact #url{padding:6px 9px}body.compact .go{padding:6px 11px}
body.compact #progress{top:26px}body.compact #tabs button{padding:2px 6px;font-size:11px}
body.loading #url{opacity:.85}
</style><style id="customSkinStyle"></style></head><body>
<div id="tabs"></div>
<div class="toolbar">
  <span class="brand"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="vertical-align:-3px;margin-right:5px"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 12h17M12 3.5c2.7 2.4 4 5.2 4 8.5s-1.3 6.1-4 8.5c-2.7-2.4-4-5.2-4-8.5s1.3-6.1 4-8.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Free Domain Browser</span>
  <button id="back" aria-label="Back" class="icon" title="Back (Alt+Left)" disabled>◀</button>
  <button id="forward" aria-label="Forward" class="icon" title="Forward (Alt+Right)" disabled>▶</button>
  <button id="reload" aria-label="Reload" class="icon" title="Reload (Cmd/Ctrl+R)">↻</button>
  <button id="home" aria-label="Home" class="icon" title="Home">⌂</button>
  <span id="sec" role="img" title="Secure connection" aria-label="Secure connection">🔒</span>
  <input id="url" value="https://yahoo.com/" autocomplete="off" spellcheck="false" title="Address and search bar" aria-label="Address and search bar" placeholder="Search or enter a domain — try hello.fdn">
  <span id="review" style="display:none;gap:2px;align-items:center"><button id="reviewUp" class="icon" title="Open the review thread to upvote" aria-label="Open the review thread to upvote">👍 <span id="reviewUpCount">0</span></button><button id="reviewDown" class="icon" title="Open the review thread to downvote" aria-label="Open the review thread to downvote">👎 <span id="reviewDownCount">0</span></button></span>
  <button id="external" aria-label="Open in system browser" class="icon" title="Open in system browser">↗</button>
  <button id="clearCache" aria-label="Clear registry cache" class="icon" title="Clear registry cache">⌫</button>
  <button id="chat" aria-label="Community chat" class="icon" title="Community chat">💬</button>
  <button id="settings" aria-label="Settings" class="icon" title="Settings (Cmd/Ctrl+,)">⚙</button>
  <button id="menu" aria-label="Browser menu" aria-haspopup="menu" class="icon" title="Browser menu (F10)">☰</button>
  <button id="go" aria-label="Go" class="go" title="Go">Go</button>
</div>
<div id="progress"></div>
<div id="statusBubble" hidden></div>
<script>
window.__fdbInitialUrl=__FDB_INITIAL_URL__;
var tabs=[{uid:0,url:window.__fdbInitialUrl||'',label:'New Tab'}];
var active=0;var lastClosed=null;var nextUid=1;var statusBubbleTimer=null;var currentSettings={theme:'system',density:'comfortable',skin:'default',custom_css:''};
var REVIEW_INDEX_URL='https://raw.githubusercontent.com/free-domain-name/registry/main/reviews/index.json';
var reviewIndex=null;var reviewPromise=null;var reviewDomain=null;
function current(){return tabs[active]}
function sourceKind(url){var u=url||'';if(/^fdn:/i.test(u))return 'registry';return /^https?:/i.test(u)?'public':'idle'}
function tabForUid(uid){for(var i=0;i<tabs.length;i++){if(tabs[i].uid===uid)return tabs[i]}return null}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function isExternal(url){return /^(https?|fdn):\/\//i.test(url||'')}
function applyTheme(){
  var theme=currentSettings.theme||'system';
  var dark=theme==='dark'||(theme==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.dataset.skin=currentSettings.skin||'default';
  try{document.getElementById('customSkinStyle').textContent=currentSettings.custom_css||''}catch(e){}
}
function render(){
  var box=document.getElementById('tabs');box.innerHTML='';
  tabs.forEach(function(t,i){
    var b=document.createElement('button');if(i===active)b.className='active';
    b.title=t.url;
    b.setAttribute('aria-label','Open '+((t.label||t.url||'New Tab')));
    b.dataset.source=sourceKind(t.url);
    var dot=document.createElement('span');dot.className='tab-dot';b.appendChild(dot);
    var label=document.createElement('span');var text=(t.label||t.url||'New Tab').trim();if(text.length>34)text=text.slice(0,34).trimEnd()+'…';label.textContent=text;b.appendChild(label);
    var close=document.createElement('span');close.className='close';close.textContent='×';close.title='Close tab';close.setAttribute('role','button');close.setAttribute('aria-label','Close tab');
    close.onclick=function(e){e.stopPropagation();closeTab(i)};b.appendChild(close);
    b.onclick=function(){active=i;render();send({cmd:'select_tab',uid:t.uid})};
    b.onauxclick=function(e){if(e.button===1){e.preventDefault();closeTab(i)}};
    box.appendChild(b);
  });
  var plus=document.createElement('button');plus.className='plus';plus.textContent='+';plus.title='New tab (Cmd/Ctrl+T)';plus.setAttribute('aria-label','New tab (Cmd/Ctrl+T)');plus.onclick=function(){newTab('')};box.appendChild(plus);
  // Never clobber text the user is typing (Tauri guards the same way while a
  // page loads); the field still updates on the next render after blur.
  var field=document.getElementById('url');
  if(document.activeElement!==field)field.value=current().url||'';
  var t=current();
  document.getElementById('back').disabled=!t.canBack;
  document.getElementById('forward').disabled=!t.canForward;
  document.getElementById('external').disabled=!isExternal(t.url);
  syncReview();
}
function newTab(u){
  var uid=nextUid++;
  tabs.push({uid:uid,url:u||'',label:'New Tab'});active=tabs.length-1;render();
  send({cmd:'new_tab',uid:uid,url:u||''});
  if(!u)send({cmd:'focus_chrome'});
}
function closeTab(i){
  if(tabs.length<2){lastClosed={url:tabs[0].url,label:tabs[0].label};send({cmd:'home'});return}
  var closing=tabs[i];
  lastClosed={url:closing.url,label:closing.label};
  tabs.splice(i,1);
  if(i<active)active--;
  if(active>=tabs.length)active=tabs.length-1;
  render();
  send({cmd:'close_tab',uid:closing.uid});
  send({cmd:'select_tab',uid:current().uid});
}
function looksLikeSearch(u){return /\s/.test(u)}
function go(){
  var u=document.getElementById('url').value.trim();
  if(!u){send({cmd:'home'});return}
  if(looksLikeSearch(u)){navigate('https://duckduckgo.com/?q='+encodeURIComponent(u));return}
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)&&!/^fdn:/i.test(u))u='https://'+u;
  navigate(u);
}
function send(cmd){console.log('fdb:'+JSON.stringify(cmd))}
function navigate(u){var t=current();t.url=u;send({cmd:'navigate',url:u})}
function settings(){send({cmd:'settings'})}
function chat(){send({cmd:'chat'})}
function about(){send({cmd:'about'})}
function external(){var u=current().url;if(isExternal(u))send({cmd:'external',url:u});}
function clearCache(){send({cmd:'clear_cache'})}
function quit(){send({cmd:'quit'})}
function closeMenu(){send({cmd:'close_settings'})}
// The browser menu is a native popup: the chrome bar is only 79 pixels tall
// and a dropdown drawn inside this page would be clipped away by the view.
// The button reports where it is so the popup opens right below it.
function openMenu(){
  var r=document.getElementById('menu').getBoundingClientRect();
  send({cmd:'menu_open',x:Math.round(r.right),y:Math.round(r.bottom)});
}
document.getElementById('menu').onclick=function(e){
  e.stopPropagation();
  openMenu();
};
function reviewHost(){
  var raw=current().url||'';
  try{
    var parsed=new URL(raw);
    var host=parsed.protocol==='fdn:'?parsed.host:parsed.hostname;
    host=(host||'').toLowerCase();
    return host||null;
  }catch(e){return null}
}
function loadReviewIndex(){
  if(reviewIndex)return Promise.resolve(reviewIndex);
  if(reviewPromise)return reviewPromise;
  reviewPromise=fetch(REVIEW_INDEX_URL,{headers:{Accept:'application/vnd.github+json'}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(data){var map={};(data&&data.domains||[]).forEach(function(entry){if(entry&&entry.domain)map[entry.domain]=entry});reviewIndex=map;return map})
    .catch(function(){reviewIndex={};return reviewIndex})
    .then(function(map){reviewPromise=null;syncReview();return map});
  return reviewPromise;
}
function syncReview(){
  if(!reviewIndex){loadReviewIndex();return}
  // The 👍/👎 control belongs to registry-sourced (fdn://) tabs only, like the
  // Tauri UI; public-DNS sites never show it.
  if(sourceKind(current().url)!=='registry'){
    var idle=document.getElementById('review');if(idle)idle.style.display='none';
    reviewDomain=null;return;
  }
  var domain=reviewHost();var entry=domain?reviewIndex[domain]:null;
  var box=document.getElementById('review');if(!box)return;
  if(!entry){reviewDomain=null;box.style.display='none';return}
  reviewDomain=domain;box.style.display='inline-flex';
  document.getElementById('reviewUpCount').textContent=String(Number(entry.up)||0);
  document.getElementById('reviewDownCount').textContent=String(Number(entry.down)||0);
}
function openReview(){if(!reviewDomain)return;send({cmd:'review',domain:reviewDomain})}
window.fdbNewTab=function(){newTab('')};
// Popup-originated tab: create it with the target already active and navigate
// IT (by uid) — no focus_chrome steal, no 250 ms "whatever tab is active by
// then" race (Tauri activates and navigates immediately, focusing the page).
window.fdbNewTabUrl=function(url){
  if(!url)return;
  var uid=nextUid++;
  tabs.push({uid:uid,url:url,label:'New Tab'});active=tabs.length-1;
  render();
  send({cmd:'new_tab',uid:uid,url:''});
  send({cmd:'navigate',url:url,uid:uid});
};
window.fdbRestoreTab=function(){if(!lastClosed)return;var u=lastClosed.url;lastClosed=null;newTab(u||'')};
window.fdbCloseActive=function(){closeTab(active)};
window.fdbFocusUrl=function(){document.getElementById('url').focus();document.getElementById('url').select()};
window.fdbReload=function(){send({cmd:'reload'})};
window.fdbQuit=function(){send({cmd:'quit'})};
window.fdbMenuBar=function(){send({cmd:'menu_bar'})};
window.fdbBack=function(){send({cmd:'back'})};
window.fdbForward=function(){send({cmd:'forward'})};
window.fdbOpenSettings=function(){settings()};
window.fdbToggleChat=function(){chat()};
window.fdbOpenExternal=function(){external()};
window.fdbClearCache=function(){clearCache()};
window.fdbAbout=function(){about()};
window.fdbSettingsOpen=function(open){var b=document.getElementById('settings');if(b)b.classList.toggle('active',!!open)};
window.fdbChatPanel=function(open){var b=document.getElementById('chat');if(b){b.classList.toggle('active',!!open);b.setAttribute('aria-expanded',open?'true':'false')}};
window.fdbCycleTab=function(delta){if(!tabs.length)return;active=(active+(delta||1)+tabs.length)%tabs.length;render();send({cmd:'select_tab',uid:current().uid})};
window.fdbSelectTab=function(index){if(index<0||index>=tabs.length)return;active=index;render();send({cmd:'select_tab',uid:current().uid})};
// Full tab-strip resync after an F5 reload of this page: reclaims uids and
// labels from the handler instead of resetting to a single placeholder tab.
window.fdbTabs=function(list,activeUid){
  if(!Array.isArray(list)||!list.length)return;
  tabs=list.map(function(t){return {uid:t.uid||0,url:t.url||'',label:t.label||'New Tab'}});
  nextUid=0;
  for(var i=0;i<tabs.length;i++)nextUid=Math.max(nextUid,tabs[i].uid+1);
  active=0;
  for(var j=0;j<tabs.length;j++){if(activeUid!=null&&tabs[j].uid===activeUid)active=j}
  render();
};
// Modern-browser behavior: no persistent status bar. Hover targets, engine
// statuses and toasts land in a transient bottom-left bubble that hides
// itself ~3 s after the last update (an empty message hides it immediately,
// e.g. when the pointer leaves a link).
window.fdbStatus=function(text){
  var el=document.getElementById('statusBubble');
  if(!el)return;
  text=String(text==null?'':text).trim();
  if(!text){clearTimeout(statusBubbleTimer);el.hidden=true;return}
  el.textContent=text;el.hidden=false;el.style.opacity='1';
  clearTimeout(statusBubbleTimer);
  statusBubbleTimer=setTimeout(function(){
    el.style.opacity='0';
    setTimeout(function(){el.hidden=true;el.style.opacity='1'},200);
  },3000);
};
window.fdbSettings=function(s){
  currentSettings={theme:s.theme||'system',density:s.density||'comfortable',skin:s.skin||'default',custom_css:s.custom_css||''};
  document.body.classList.toggle('compact',s.density==='compact'||!!s.compact_tabs);
  applyTheme();
};
window.fdbLoad=function(loading,back,forward,uid){
  var t=tabForUid(uid);if(!t)return;t.canBack=!!back;t.canForward=!!forward;
  if(uid===current().uid){render();document.getElementById('reload').textContent=loading?'✕':'↻';document.body.classList.toggle('loading',!!loading)}
};
window.fdbUpdate=function(url,title,uid){
  var t=tabForUid(uid);if(!t)return;
  if(typeof url==='string')t.url=url;else if(url)t.url=url;
  if(title)t.label=title;
  // The security indicator and visible state belong to the active tab:
  // a background tab finishing its load must not flip the lock icon here.
  if(uid!==current().uid)return;
  var sec=document.getElementById('sec');
  if(sec){sec.textContent=(url&&url.indexOf('https://')===0)?'🔒':(url&&url.indexOf('http://')===0)?'⚠':'📄'}
  render();
  syncReview();
};
document.getElementById('url').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
document.getElementById('back').onclick=function(){send({cmd:'back'})};
document.getElementById('forward').onclick=function(){send({cmd:'forward'})};
document.getElementById('reload').onclick=function(){send({cmd:'reload'})};
document.getElementById('home').onclick=function(){send({cmd:'home'})};
document.getElementById('go').onclick=go;
document.getElementById('external').onclick=external;
document.getElementById('reviewUp').onclick=openReview;
document.getElementById('reviewDown').onclick=openReview;
document.getElementById('clearCache').onclick=clearCache;
document.getElementById('chat').onclick=chat;
document.getElementById('settings').onclick=settings;
document.addEventListener('keydown',function(e){
  var mod=e.metaKey||e.ctrlKey;
  if(e.key==='Escape'){closeMenu();return}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==='t'&&lastClosed){e.preventDefault();var u=lastClosed.url;lastClosed=null;newTab(u||'')}
  else if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();newTab('')}
  else if(mod&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(active)}
  else if(mod&&e.key.toLowerCase()==='l'){e.preventDefault();document.getElementById('url').focus();document.getElementById('url').select()}
  else if(mod&&e.key.toLowerCase()==='r'){e.preventDefault();send({cmd:'reload'})}
  else if(e.key==='F5'){e.preventDefault();send({cmd:'reload'})}
  else if(e.key==='F10'||(e.altKey&&(e.key==='f'||e.key==='F'))){e.preventDefault();openMenu()}
  else if(mod&&e.key.toLowerCase()==='q'){e.preventDefault();quit()}
  else if(mod&&e.key===','){e.preventDefault();settings()}
  else if((e.altKey&&e.key==='ArrowLeft')||(mod&&e.key==='[')){e.preventDefault();send({cmd:'back'})}
  else if((e.altKey&&e.key==='ArrowRight')||(mod&&e.key===']')){e.preventDefault();send({cmd:'forward'})}
  else if(e.ctrlKey&&e.key==='Tab'){e.preventDefault();var d=e.shiftKey?-1:1;active=(active+d+tabs.length)%tabs.length;render();send({cmd:'select_tab',uid:current().uid})}
  else if(mod&&/^[1-9]$/.test(e.key)){e.preventDefault();var n=Math.min(parseInt(e.key,10)-1,tabs.length-1);active=n;render();send({cmd:'select_tab',uid:current().uid})}
});
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}}
applyTheme();render();
</script>
</body></html>
