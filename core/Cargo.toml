[package]
name = "fdn-core"
version = "0.1.2"
edition = "2021"
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs"] }
hickory-resolver = "0.26"
