name: ci
on:
  # The CI runs when a person starts it, and once a week on the cheap gates.
  # The heavy jobs (the Linux image, the Windows package, the macOS build)
  # only run on a manual start: a full run costs about an hour of GitHub
  # runners, and that is too much to spend on every push. The release
  # workflow works the same way, with a monthly canary instead of a weekly
  # one.
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check the formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fdn-core

  linux-build:
    # The heavy jobs only run when the workflow is started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the browser on Linux
        run: docker build -f Dockerfile.linux -t fdb-cef-linux .
      - name: Smoke-test the Linux build
        run: docker run --rm --shm-size=1g fdb-cef-linux
      - name: Run the verification journeys
        env:
          # The image already carries the build of this tree.
          FDB_SKIP_BUILD: "1"
        run: |
          mkdir -p verification/artifacts
          docker run --rm --shm-size=1g \
            -v "$PWD/verification/artifacts:/app/verification/artifacts" \
            --entrypoint /app/scripts/verify-linux.sh fdb-cef-linux
      - name: Upload the screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots-linux
          path: verification/artifacts

  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Render the chrome pages in a Linux container
        run: ./scripts/test-docker.sh

  macos-smoke:
    # The heavy jobs only run when the workflow is started by hand.
    if: github.event_name == 'workflow_dispatch'
    # `macos-14` was retired as a hosted image; the job was cancelled before
    # it ran a single step. `macos-latest` is the supported label.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Cache CEF binary
        uses: actions/cache@v4
        with:
          path: cef-binary
          # The runner architecture decides which CEF archive is downloaded,
          # so the cache key has to follow it.
          key: cef-156.0.26-${{ runner.os }}-${{ runner.arch }}-v1
      - run: cargo test --bin free-domain-browser-cef
      - name: Hidden CEF smoke
        env:
          FDB_SMOKE_EXPECT: github.com
        run: ./scripts/smoke-hidden.sh
      - name: Upload CEF log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cef-smoke-log
          path: ${{ runner.temp }}/free-domain-browser-cef-smoke.log

  verify:
    # The heavy jobs only run when the workflow is started by hand.
    if: github.event_name == 'workflow_dispatch'
    # The journeys drive the real browser and read what is really there.
    # A build server has no screen, so the browser starts hidden.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The runner speaks the DevTools protocol over a WebSocket, which
          # Node ships from version 20.10 on.
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Cache CEF binary
        uses: actions/cache@v4
        with:
          path: cef-binary
          # The runner architecture decides which CEF archive is downloaded,
          # so the cache key has to follow it.
          key: cef-156.0.26-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build the browser
        run: scripts/build.sh
      - name: Run the verification journeys
        env:
          FDB_VERIFY_HIDDEN: "1"
        run: node verification/run.mjs
      - name: Upload the screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: verification/artifacts

  windows-smoke:
    # The heavy jobs only run when the workflow is started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The runner speaks the DevTools protocol over a WebSocket, which
          # Node ships from version 20.10 on.
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # NSIS is installed here on purpose: without it the packaging script
      # skips the installer and the path stays untested.
      - name: Install the Windows build tools
        shell: pwsh
        run: choco install cmake ninja nsis -y --no-progress
      - name: Package the browser
        shell: pwsh
        run: ./scripts/package-windows.ps1
        env:
          FDB_PROFILE: debug
      - name: Hidden CEF smoke
        shell: pwsh
        env:
          FDB_SMOKE_EXPECT: github.com
        run: ./scripts/smoke-hidden.ps1
      - name: Run the verification journeys
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - name: Upload CEF log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cef-smoke-log-windows
          path: ${{ runner.temp }}/free-domain-browser-cef-smoke.*.log
      - name: Upload the screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots-windows
          path: verification/artifacts
