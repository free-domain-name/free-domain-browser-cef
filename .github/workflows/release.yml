name: Release portable builds

on:
  push:
    tags:
      - "v*"
  # A manual run builds every platform and uploads the artifacts without
  # publishing a release, so a build can be checked on demand.
  workflow_dispatch:
  # A monthly canary build: the packages are produced and uploaded as
  # workflow artifacts, but no GitHub release is created. This catches a
  # broken toolchain or dependency before a tagged release does.
  schedule:
    - cron: "27 5 1 * *"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: ./scripts/package-release.sh
          - name: Linux
            os: ubuntu-22.04
            command: ./scripts/package-linux.sh
          - name: Windows
            os: windows-latest
            command: pwsh -NoProfile -File scripts/package-windows.ps1
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux CEF build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libnss3-dev \
            libx11-xcb-dev libxkbcommon-dev libgbm-dev libasound2-dev \
            libatk1.0-dev libcups2-dev libdrm-dev libxrandr-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libpango1.0-dev \
            libcairo2-dev

      - name: Install macOS CEF build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Windows CEF build tools
        if: runner.os == 'Windows'
        run: choco install cmake ninja nsis -y --no-progress

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and package
        shell: bash
        run: ${{ matrix.command }}

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FreeDomainBrowser-CEF-${{ runner.os }}
          path: |
            target/FreeDomainBrowser-CEF.zip
            target/FreeDomainBrowser-CEF.dmg
            target/FreeDomainBrowser-CEF-linux-*.tar.gz
            target/FreeDomainBrowser-CEF-linux-*.deb
            target/FreeDomainBrowser-CEF-windows-x64.zip
            target/FreeDomainBrowser-CEF-windows-x64-setup.exe

  release:
    needs: package
    # Only a tagged run publishes. A manual or scheduled run keeps the build
    # artifacts but creates no GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./* > checksums.txt

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          # The CEF build is a preview: the packages are unsigned, there is no
          # notarization and no installer, so it must not become "Latest".
          prerelease: true
          make_latest: false
          body: |
            Portable preview builds of the CEF (Chromium Embedded Framework) browser.

            - macOS: portable zip and disk image
            - Linux: portable tar.gz and Debian package
            - Windows: portable zip and setup executable

            These builds are unsigned and are not notarized, so macOS and Windows may
            ask you to confirm the first launch. Every file is listed in
            `checksums.txt` with its SHA-256.

            The Tauri build with signed installers is the stable one:
            https://github.com/free-domain-name/tauri-browser/releases

            Source code: https://github.com/free-domain-name/free-domain-browser-cef
            Page: https://free-domain-name.github.io/free-domain-browser-cef/
            Registry: https://github.com/free-domain-name/registry
