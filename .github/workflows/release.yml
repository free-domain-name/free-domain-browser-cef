name: Release portable builds

on:
  push:
    tags:
      - "v*"
  # A manual run builds every platform and uploads the artifacts without
  # publishing a release, so a build can be checked on demand.
  workflow_dispatch:
  # A monthly canary build: the packages are produced and uploaded as
  # workflow artifacts, but no GitHub release is created. This catches a
  # broken toolchain or dependency before a tagged release does.
  schedule:
    - cron: "27 5 1 * *"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The signing secrets are read here so the steps can tell whether they are
    # there: a run without them keeps the ad-hoc signed build.
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: ./scripts/package-release.sh
          - name: Linux
            os: ubuntu-22.04
            command: ./scripts/package-linux.sh
          - name: Windows
            os: windows-latest
            command: pwsh -NoProfile -File scripts/package-windows.ps1
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux CEF build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libnss3-dev \
            libx11-xcb-dev libxkbcommon-dev libgbm-dev libasound2-dev \
            libatk1.0-dev libcups2-dev libdrm-dev libxrandr-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libpango1.0-dev \
            libcairo2-dev

      - name: Install macOS CEF build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Windows CEF build tools
        if: runner.os == 'Windows'
        run: choco install cmake ninja nsis -y --no-progress

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and package
        shell: bash
        run: ${{ matrix.command }}

      # The Developer ID and the notary key are secrets. A fork or a run
      # without them keeps the ad-hoc signed build.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/DeveloperID.p12"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperID.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          identity=$(security find-identity -v -p codesigning |
            sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "no Developer ID Application identity in the imported keychain" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign the app with the Developer ID
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        shell: bash
        run: ./scripts/sign-release.sh "$SIGN_IDENTITY"

      - name: Notarize the signed build
        if: runner.os == 'macOS' && env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit target/FreeDomainBrowser-CEF.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple target/bundle/free-domain-browser-cef.app
          # The ticket travels with the app, so the archives are rebuilt from
          # the stapled bundle.
          rm -f target/FreeDomainBrowser-CEF.zip target/FreeDomainBrowser-CEF.dmg
          ditto -c -k --keepParent target/bundle/free-domain-browser-cef.app \
            target/FreeDomainBrowser-CEF.zip
          hdiutil create -volname "Free Domain Browser" \
            -srcfolder target/bundle/free-domain-browser-cef.app \
            -ov -format UDZO target/FreeDomainBrowser-CEF.dmg
          xcrun stapler validate target/bundle/free-domain-browser-cef.app
          spctl --assess --type execute --verbose=2 \
            target/bundle/free-domain-browser-cef.app

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FreeDomainBrowser-CEF-${{ runner.os }}
          path: |
            target/FreeDomainBrowser-CEF.zip
            target/FreeDomainBrowser-CEF.dmg
            target/FreeDomainBrowser-CEF-linux-*.tar.gz
            target/FreeDomainBrowser-CEF-linux-*.deb
            target/FreeDomainBrowser-CEF-windows-x64.zip
            target/FreeDomainBrowser-CEF-windows-x64-setup.exe

  release:
    needs: package
    # Only a tagged run publishes. A manual or scheduled run keeps the build
    # artifacts but creates no GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./* > checksums.txt

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          # The CEF build is a preview: the packages are unsigned, there is no
          # notarization and no installer, so it must not become "Latest".
          prerelease: true
          make_latest: false
          body: |
            Portable preview builds of the CEF (Chromium Embedded Framework) browser.

            - macOS: portable zip and disk image
            - Linux: portable tar.gz and Debian package
            - Windows: portable zip and setup executable

            These builds are unsigned and are not notarized, so macOS and Windows may
            ask you to confirm the first launch. Every file is listed in
            `checksums.txt` with its SHA-256.

            The Tauri build with signed installers is the stable one:
            https://github.com/free-domain-name/tauri-browser/releases

            Source code: https://github.com/free-domain-name/free-domain-browser-cef
            Page: https://free-domain-name.github.io/free-domain-browser-cef/
            Registry: https://github.com/free-domain-name/registry
