[workspace]
members = ["core"]

[package]
name = "free-domain-browser-cef"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "bundle"

[features]
# CEF's Windows sandbox/bootstrap mode (not enabled by default).
sandbox = []

[[bin]]
name = "free-domain-browser-cef"
path = "src/main.rs"

[[bin]]
name = "free_domain_browser_cef_helper"
path = "src/bin/helper.rs"

[package.metadata.cef.bundle]
helper_name = "free_domain_browser_cef_helper"

[dependencies]
fdn-core = { path = "core" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "macros", "net", "io-util"] }
ctrlc = "3"
libc = "0.2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "http2"] }
hex = "0.4"
rand = "0.8"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "0.102.0", default-features = false, features = ["net"] }
keyring = { version = "3.6", features = ["apple-native"] }
n0-future = "0.3"
sha2 = "0.11"
cef = { version = "156.4.0", default-features = false, features = ["build-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSEvent",
  "NSResponder",
  "NSUserInterfaceValidation",
  "NSView",
  "NSWindow",
] }

[[bin]]
name = "bundle"
path = "src/bin/bundle.rs"


[dependencies.semver]
version = "1"

[patch.crates-io]
# Patched only to raise the CDN index read limit from 10 MB to 64 MB.
# CEF's index is currently larger than the default, which made a clean
# `cargo build` fail before downloading anything.
download-cef = { path = "vendor/download-cef" }
