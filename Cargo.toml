[workspace]
members = ["core"]

[package]
name = "free-domain-browser-cef"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "free-domain-browser-cef"
path = "src/main.rs"

[[bin]]
name = "free_domain_browser_cef_helper"
path = "src/bin/helper.rs"

[package.metadata.cef.bundle]
helper_name = "free_domain_browser_cef_helper"

[dependencies]
url = "2"
cef = { version = "156.4.0", default-features = false, features = ["build-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSEvent",
  "NSResponder",
  "NSUserInterfaceValidation",
  "NSView",
  "NSWindow",
] }

[[bin]]
name = "bundle"
path = "src/bin/bundle.rs"

[dependencies.anyhow]
version = "1"

[dependencies.semver]
version = "1"
